name: Cohere Technologies
description: >-
  Cohere Technologies is a San Jose, California wireless communications software
  company developing spectral-efficiency technology for mobile networks. Its
  Universal Spectrum Multiplier (USM) software delivers a 2x spectrum multiplier
  for 4G, 5G, and Multi-G networks across FDD and TDD bands, and its Pulsone
  technology applies the Zak-OTFS (Orthogonal Time Frequency Space) waveform to
  Integrated Sensing and Communications (ISAC) and Non-Terrestrial Networks
  (NTN). The company sells to mobile network operators and Open RAN ecosystems
  and is backed by Lightspeed Venture Partners, NEA, Telstra Ventures, Intel
  Capital, Koch Investments Group, VMware, and Juniper Networks. Cohere
  Technologies is a portfolio company of Lightspeed Venture Partners and does not
  currently publish a public developer API, SDK, or documentation surface.
